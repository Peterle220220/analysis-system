agent_id: a7_analyst
version: 1
description: "Rut insight co bang chung. Code tinh so, model chi dien giai."

allow:
  # artifacts:// is here so A7 can read the process map A6 wrote. Same shape as
  # A8 already has: reading what an earlier task in this run produced, not
  # reaching outside the pipeline.
  read:  ["mart://**", "clean://**", "validation://**", "profile://**", "artifacts://**"]
  write: ["artifacts://**"]
  tools: ["pandas"]
  llm:
    enabled: true
    purpose: interpret_metrics_only
    max_sample_rows: 0        # A7 khong nhin du lieu, chi nhin chi so da tinh
    # Cho kho nhat sau a9: cau phai dung {placeholder} va tuyet doi khong go
    # mot chu so nao. Do duoc 12/12 cau song sot qua render_all, 4/4 tieng Viet
    # CO DAU, va nhanh nhat trong sau ung vien (3,6 giay).
    model: google/gemma-3-12b-it
    # Xep theo tieng Viet CO DAU, vi luan diem khong dau thi phep kiem do lien
    # quan tu choi cham (L65) - tuc bo kiem do lang le ngung hoat dong.
    # qwen KHONG co o day: no do duoc 0/4 co dau.
    # Chan cuoi phai DO DUOC, khong phai mot con nua giong hai con dau.
    #
    # Do tren cau hoi kho nhat cua chu he thong (chien luoc marketing cho nhom
    # duoi 30 tuoi): gemma go so tran, tut xuong glm cung go so tran, tut xuong
    # gpt-oss van go so tran. Ba lan thu, ba model, cung mot kieu hong, va ca
    # lan chay chet - nguoi hoi khong nhan duoc gi.
    #
    # Sonnet 5 giu duoc ky luat placeholder: 0 lan bia so tren 3 lan chay khi no
    # ngoi ghe Manager. Cau hoi thuong khong bao gio cham toi day - gemma xong
    # ngay lan dau; chi cau kho moi tut xuong toi no, va luc do $0,03 re hon
    # nhieu so voi mot cau tra loi khong co.
    fallback:
      - z-ai/glm-5.3-flash
      - anthropic/claude-sonnet-5

deny:
  - network_access
  - write_outside_scope
  - state_number_not_in_metrics   # cam tuyet doi - co che placeholder cuong che
  - modify_data
  - shell_exec

limits:
  max_findings: 10
  max_runtime_s: 300
  max_tokens: 40000
  max_retries: 3

must_return:
  schema: AnalysisResult
  required_fields: [source, question, findings]

# Nguoi dung chon cot nao thi cot do vao day. Chia theo vai tro do duoc chu
# khong bat nguoi chon phai tu noi cai nao la nhom cai nao la so.
consumes_features:
  - param: dimensions
    kind: column
    roles: [categorical, temporal]
  - param: measures
    kind: column
    roles: [numeric]

human_gate:
  required: true
  at: after_execution
  approve: findings          # HUMAN GATE 2

on_violation: HALT_AND_ESCALATE

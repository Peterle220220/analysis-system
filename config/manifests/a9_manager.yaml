agent_id: a9_manager
version: 1
description: "Tong hop bao cao cua cac skill thanh cau tra loi co lap luan va bang chung."

allow:
  read:  ["artifacts://**", "mart://**", "clean://**", "validation://**", "profile://**"]
  write: ["artifacts://**"]
  tools: ["pandas", "matplotlib"]
  llm:
    enabled: true
    purpose: synthesise_reported_findings_only
    max_sample_rows: 0        # A9 khong nhin du lieu tho, chi nhin bao cao va chi so
    # GHE GIAM DOC. Cho kho nhat trong he thong: doc bao cao cua moi skill roi
    # tong hop thanh lap luan tra loi.
    #
    # Ke hoach ban dau la Claude Opus 5 qua handoff - tuc la dan tay vao tai
    # khoan Pro. Chu he thong bo cach do va chuyen sang API co tinh tien, nen
    # ghe nay goi thang Opus 5 qua OpenRouter. Trong mot quang thoi gian dong
    # nay ghi gemma-3-12b-it, va Manager da chay bang mot model 12B trong khi
    # cau hinh o cho khac van ghi 'manager_model: claude-opus-5' - mot dong
    # khong ai doc, vi provider openrouter khong doc no.
    #
    # Dat o day chu khong o settings.yaml vi day la cho duy nhat provider
    # openrouter thuc su tim model cho tung skill.
    #
    # DO TREN VIEC THAT, 3 lan moi model, cau hoi co dau, tren 316 chi so ma
    # cac skill day len. Sonnet 5 duoc chon vi:
    #
    #   model            luan diem  bia so  lan CO CANH BAO   USD    giay
    #   sonnet-5              4,0      0        2/3         0,0615  45+-2
    #   opus-5                3,7      0        1/3         0,1393  41+-1
    #   gemini-2.5-flash      4,3    0,3        0/3         0,0095  30+-1
    #   deepseek-v3.2         4,0      0        0/3         0,0062  171+-29
    #   minimax-m3            2,7    0,3        0/3         0,0103  43+-4
    #
    # "Canh bao" la cot duy nhat tach duoc mot Manager voi mot cai may doc bang.
    # Ke lai bac thang "hoc nhieu diem cao" thi con nao cung lam duoc; noi ra
    # rang KHONG the ket luan tu bac thang do thi chi hai con Anthropic lam.
    # Ba con kia: 0 canh bao tren 33 luan diem.
    #
    # Opus KHONG duoc chon du no dua ra cai nhin sac nhat (no bat duoc rang bac
    # diem va diem thi gan chat voi nhau 91,43% phuong sai, nen xu huong theo
    # bac diem gan nhu la mot vong tron). No lam duoc dieu do MOT lan roi im hai
    # lan, trong khi Sonnet canh bao deu hon o hai phan ba so lan - va gia bang
    # 44%. Mot Manager gioi that thuong khong bang mot Manager canh bao deu.
    model: anthropic/claude-sonnet-5
    # Tut len Opus truoc, khong tut xuong. Fallback ton tai de mot lan chay
    # khong chet; ha cap ghe giam doc xuong mot model khong bao gio canh bao thi
    # lan chay song sot nhung cau tra loi thi khong.
    #
    # Deepseek lam chan cuoi vi no khong bia so lan nao (0/3) - khong phai vi no
    # tot, ma vi thu toi nhat la doc mot bao cao voi so lieu khong co that. No
    # KHONG phai model cua worker nao: khong ai vua lam worker vua ngoi ghe nay.
    fallback:
      - anthropic/claude-opus-5
      - deepseek/deepseek-v3.2

deny:
  - network_access
  - write_outside_scope
  - state_number_not_in_metrics   # cung co che placeholder nhu A7
  - modify_data
  - shell_exec

limits:
  max_claims: 8
  max_runtime_s: 300
  max_tokens: 40000
  max_retries: 3

must_return:
  schema: ManagerAnswer
  required_fields: [question, claims]

# Manager rut ra ket luan, nen day la cho de bia nhat trong ca he thong. Miem tru
# no khoi luat ma moi agent khac phai theo la dat thanh phan it bi kiem nhat vao
# dung cho gay hai nhieu nhat. Nguoi dung duyet lap luan truoc khi no thanh bao cao.
human_gate:
  required: true
  at: after_execution
  approve: claims

on_violation: HALT_AND_ESCALATE

agent_id: a9_manager
version: 1
description: "Tong hop bao cao cua cac skill thanh cau tra loi co lap luan va bang chung."

allow:
  read:  ["artifacts://**", "mart://**", "clean://**", "validation://**", "profile://**"]
  write: ["artifacts://**"]
  tools: ["pandas", "matplotlib"]
  llm:
    enabled: true
    purpose: synthesise_reported_findings_only
    max_sample_rows: 0        # A9 khong nhin du lieu tho, chi nhin bao cao va chi so
    # GHE GIAM DOC. Ke hoach cua chu he thong la Claude Opus 5 qua handoff
    # (tai khoan Pro) - day la cho kho nhat: doc bao cao cua moi skill roi tong
    # hop thanh lap luan tra loi.
    #
    # Dong nay CHI co tac dung khi chay bang provider openrouter. Chay handoff
    # thi moi agent deu ve tay nguoi, va do la chu y chu khong phai thieu sot:
    # mot dong YAML khong doi duoc AI dang dan vao Claude.
    model: google/gemma-3-12b-it
    # Ghe giam doc. Khi chay bang handoff thi ca dong nay lan dong model deu
    # khong co tac dung - moi thu ve tay nguoi, va do la chu y.
    fallback:
      - z-ai/glm-5.3-flash
      - openai/gpt-oss-20b

deny:
  - network_access
  - write_outside_scope
  - state_number_not_in_metrics   # cung co che placeholder nhu A7
  - modify_data
  - shell_exec

limits:
  max_claims: 8
  max_runtime_s: 300
  max_tokens: 40000
  max_retries: 3

must_return:
  schema: ManagerAnswer
  required_fields: [question, claims]

# Manager rut ra ket luan, nen day la cho de bia nhat trong ca he thong. Miem tru
# no khoi luat ma moi agent khac phai theo la dat thanh phan it bi kiem nhat vao
# dung cho gay hai nhieu nhat. Nguoi dung duyet lap luan truoc khi no thanh bao cao.
human_gate:
  required: true
  at: after_execution
  approve: claims

on_violation: HALT_AND_ESCALATE

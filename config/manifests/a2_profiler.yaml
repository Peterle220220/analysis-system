agent_id: a2_profiler
version: 1
description: "Mo ta du lieu: schema, chat luong, bat thuong. READ-ONLY tuyet doi."

allow:
  read:  ["staging://**"]
  write: ["profile://**"]
  tools: ["pandas", "profiling.describe"]
  llm:
    enabled: true
    purpose: interpret_profile_only
    max_sample_rows: 20
    # Chon vi CHO CHUA, khong phai vi diem cao. Ho so du lieu lon theo SO COT,
    # va day la agent nhan ho so day du - mot bang 50 cot lam tran cua so
    # 131K token cua ba con kia. Con nay chua duoc 1,31 trieu token.
    model: z-ai/glm-5.3-flash
    # Con chinh chon vi cua so ngu canh; du phong la hai con do duoc 4/4 schema.
    # Bang qua rong thi con du phong co the tran, va tran thi bao loi ro rang -
    # con hon dung lai vi mot lan tra loi hong.
    fallback:
      - google/gemma-3-12b-it
      - openai/gpt-oss-20b

deny:
  - network_access
  - write_outside_scope
  - modify_data
  - shell_exec

limits:
  max_runtime_s: 300
  max_tokens: 40000
  max_retries: 3

must_return:
  schema: ProfileReport
  required_fields: [row_count, column_count, columns, pii_flags, eventlog_candidates]

human_gate:
  required: false

on_violation: HALT_AND_ESCALATE

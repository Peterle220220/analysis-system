agent_id: a3_cleaner
version: 1
description: "De xuat rule lam sach, va CHI thuc thi rule da duoc duyet."

allow:
  read:  ["staging://**", "profile://**"]
  write: ["clean://**"]
  tools: ["pandas", "rulebook.apply"]
  llm:
    enabled: true
    purpose: propose_rules_only
    max_sample_rows: 20
    # Viec nhe, va con co mot nguoi duyet dung sau: moi rule phai qua human_gate
    # truoc khi duoc chay. Con re nhat trong nhom chay duoc ($0,0009/cau) la du,
    # vi sai o day bi bat truoc khi no cham vao du lieu.
    model: openai/gpt-oss-20b
    # Viec nhe va co nguoi duyet dung sau, nen du phong chi can chay duoc.
    fallback:
      - google/gemma-3-12b-it
      - z-ai/glm-5.3-flash

deny:
  - network_access
  - write_outside_scope
  - drop_column
  - custom_rule_outside_rulebook
  - shell_exec

limits:
  max_rows_dropped_pct: 5
  max_runtime_s: 300
  max_tokens: 40000
  max_retries: 3

must_return:
  schema: CleanResult
  required_fields: [rows_in, rows_out, rules_applied, diff_log, content_hash]

human_gate:
  required: true
  at: before_execution
  approve: proposed_rules

on_violation: HALT_AND_ESCALATE

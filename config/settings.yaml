# Duong dan TUNG TANG khai bao doc lap - KHONG suy ra tu mot thu muc goc chung.
# Cho phep sau nay tro rieng mot tang sang o khac ma khong sua dong code nao.
#
# ${ANALYSIS_DATA} mac dinh la ~/analysis-data, ${ANALYSIS_RUNS} mac dinh la
# ~/analysis-runs. Dat bien moi truong de tro sang o dia khac ma khong sua file
# nay - nho vay cung mot file cau hinh chay duoc tren laptop lan tren server.
layers:
  raw:        ${ANALYSIS_DATA}/raw
  extracted:  ${ANALYSIS_DATA}/extracted
  staging:    ${ANALYSIS_DATA}/staging
  clean:      ${ANALYSIS_DATA}/clean
  mart:       ${ANALYSIS_DATA}/mart
  profile:    ${ANALYSIS_DATA}/profile
  validation: ${ANALYSIS_DATA}/validation
  artifacts:  ${ANALYSIS_DATA}/artifacts
  runs:       ${ANALYSIS_RUNS}

cleaning:
  # BAT BUOC tuong minh - cam doan timezone.
  # BPI Challenge 2019: 100% time:timestamp ket thuc bang "Z" -> du lieu da o UTC.
  assume_timezone: UTC
  # Cot nao chiu rule nao - la cau hinh, khong phai hang so chon trong code.
  datetime_columns: [timestamp]
  numeric_columns:  [event_seq, cumulative_net_worth_eur]
  required_columns: [case_id, activity, timestamp]

validation:
  max_rows_dropped_pct: 5.0
  not_null_columns: [case_id, event_seq, activity, timestamp]
  unique_together:
    - [case_id, event_seq]

llm:
  # handoff  = ghi prompt ra file, nguoi dan vao Claude (goi Pro), KHONG ton tien
  # cassette = phat lai cau tra loi da ghi, KHONG ton tien, dung cho test
  # gemini   = goi API Gemini, ban free KHONG ton tien nhung Google DUNG DU LIEU
  #            GUI LEN DE HUAN LUYEN -> chi dung voi fixture cong khai, TUYET DOI
  #            khong dung voi du lieu khach hang
  # openrouter= mot cong toi vai tram model; MOI SKILL chon model rieng trong
  #            manifest cua no. Ban free doi lay du lieu (train + publish) nen
  #            chi dung fixture cong khai; ban tra phi ~$0,004 mot cau hoi va
  #            KHONG doi gi ca.
  # anthropic= goi API that, CO TON TIEN
  # none     = khong dung model nao ca
  provider: openrouter
  manager_model: claude-opus-5
  worker_model:  claude-sonnet-5
  gemini_model:  gemini-flash-lite-latest
  # Model dung khi manifest KHONG khai gi - va quan trong hon: PLANNER dung dong
  # nay. Planner khong phai mot agent nen khong co manifest, ma lap ke hoach lai
  # la viec kho nhi sau tong hop. De mac dinh la con free thi ke hoach hong ngay
  # buoc dau, truoc khi bat ky skill nao kip chay - da xay ra dung nhu vay.
  openrouter_model: nvidia/nemotron-3-super-120b-a12b:free
  # Muc suy nghi noi bo cua Gemini. 'low' la du: cac tac vu o day deu la dien
  # vao mot khuon da khai bao san. De cao hon thi model suy nghi dai, tieu het
  # ngan sach dau ra, va tra ve JSON bi cat giua chung.
  gemini_thinking: low
  dev_mode: true          # true -> ep ca hai vai tro ve worker_model cho re
  cassette_dir: tests/cassettes

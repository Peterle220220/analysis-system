[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-system"
version = "0.1.0"
description = "Multi-agent data processing system for business analysis (Phase 0 baseline)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings",
    "duckdb>=0.10",
    "pandas>=2.2",
    "pyarrow",
    "pandera>=0.19",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml",
    "rich",
    # Phase 1. Cai SDK khong ton tien - chi khi provider "anthropic" duoc bat
    # va goi API that thi moi phat sinh chi phi.
    "anthropic>=0.40",
    # Phase 2
    "openpyxl",     # A1 doc xlsx, A8 xuat xlsx
    "matplotlib",   # A8 ve bieu do PNG
    "python-docx",  # xuat DOCX (BUILD_SPEC muc 3, Phase 3)
    "fastapi",         # Tang 1: dashboard
    "uvicorn",         # may chu chay dashboard
    "python-multipart",# doc form HTML cua dashboard
    # Thong ke suy dien: tuong quan, kiem dinh, ANOVA. Chi cac phep kiem tat
    # dinh - khong co ML du doan, vi mot du doan khong truy nguoc ve dong du
    # lieu nao duoc, ma tieu chi S4 doi dieu do.
    "scipy>=1.14",
    # Phase 5: doc du lieu phi cau truc. Moi thu o day chi chay khi co file
    # tuong ung duoc dua vao - mot bang CSV khong cham toi cai nao.
    "pypdf>=5.0",        # E1 doc PDF co lop text
    "pdfplumber>=0.11",  # E1 doc bang trong PDF, va toa do de truy nguoc ve trang
    "pytesseract>=0.3",  # E2 OCR - can goi he thong `tesseract-ocr` (+ `-vie`)
    "pillow>=10.0",      # E2 mo va chuan hoa anh truoc khi OCR
    # E3 nhan dang tieng noi. NANG: tai model vai tram MB o lan chay dau, va
    # can `ffmpeg` cai o muc he thong. Chi tai khi thuc su co file am thanh.
    "faster-whisper>=1.0",
    # Phase 6: do xem bien nao mang ket qua, va nhom cac dong giong nhau. KHONG
    # du doan tung dong - mot du doan truy nguoc ve mot mo hinh va mot hat giong
    # ngau nhien, khong ve dong du lieu nao, ma tieu chi S4 doi dieu do.
    "scikit-learn>=1.5",
    # Kiem xem cau tra loi co dung la tra loi CAU HOI khong. So bang y
    # nghia chu khong bang tu chung: do tren 16 ca that, so tu dung 9/16
    # va VUT NHAM 7 cau tra loi that; so y nghia dung 13/16 va vut nham 0.
    #
    # NANG. Cai kem torch. Hay cai ban CPU:
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    # Ban CUDA keo theo 4.4 GB thu vien GPU khong bao gio chay - venv 6.6 GB
    # so voi 2.2 GB.
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pandas-stubs", "types-PyYAML", "scipy-stubs"]

# Cai dat xong la co lenh `asys` tren PATH, khong can script bao ngoai.
[project.scripts]
asys = "analysis_system.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# ruff 0.16 dinh dang ca code block trong Markdown - BUILD_SPEC.md la tai lieu,
# khong phai code, khong duoc de no bi dinh dang lai.
extend-exclude = [".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RET", "SIM", "ARG", "TID"]

[tool.ruff.lint.per-file-ignores]
# BUILD_SPEC Muc 10 dat ten ngoai le nay la BoundaryViolation. Ten do la mot phan
# cua hop dong giua cac module, khong doi thanh BoundaryViolationError.
"src/analysis_system/services/boundary.py" = ["N818"]
"src/analysis_system/services/budget.py" = ["N818"]   # BudgetExceeded, cung ly do

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "tasks.py"]

[[tool.mypy.overrides]]
# Nhung goi khong phat hanh kem type stub. Doc PDF/anh/am thanh la ranh gioi
# giua he thong nay va the gioi ben ngoai, va o ranh gioi do kieu duoc kiem
# bang chinh code cua minh chu khong phai bang stub cua nguoi khac.
module = ["duckdb.*", "pandera.*", "pytesseract.*", "faster_whisper.*", "pdfplumber.*", "sklearn.*", "sentence_transformers.*", "openpyxl.*", "docx.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# scripts/ khong phai package - them vao duong dan de test import duoc
pythonpath = ["scripts"]
